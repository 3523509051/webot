# 微信 AGI 群聊助手 · AstrBot 编排
#
# 架构（只有一个容器）：
#   Windows 本机：微信客户端 + bridge/（Python 桥，非容器）
#         ↕  OneBot v11 反向 WebSocket（ws://127.0.0.1:6199/ws）
#   容器内：AstrBot（aiocqhttp 平台适配 + 默认 LLM 管线 + 本仓库插件）
#
# 因此这里**只有 astrbot 一个服务**。早期调研过的「Pad 协议桥」路线需要
# wechatpadpro / mysql / redis 三个容器，当前链路用不到，其编排定义已挪到
# docs/wechatpadpro-notes.md，需要时按那份文档单独起。
#
# 常用命令：
#   docker compose up -d astrbot      # 首次启动 / 有改动时重建
#   docker compose restart astrbot    # 改了插件或面板配置后重启
#   docker compose logs -f astrbot    # 跟日志
#   docker compose down               # 停止（数据在 ./data/astrbot，不会丢）

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: webot-astrbot
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${ASTRBOT_WEB_PORT:-6185}:6185"   # WebUI 管理面板
      - "${ONEBOT_WS_PORT:-6199}:6199"     # OneBot v11 反向 WS（桥连这里）
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data/astrbot:/AstrBot/data
      # 插件源码以仓库 ./plugins 为准（覆盖容器里的运行时副本）
      # ⚠️ 缺这一行时，改 ./plugins 下的代码不会生效 —— 容器只会读 data/astrbot/plugins
      - ./plugins:/AstrBot/data/plugins
